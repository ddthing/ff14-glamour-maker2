name: Verify

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: npm ci

      - name: Run syntax and contract checks
        run: npm run check

      - name: Install background-service test dependency
        run: python -m pip install -r requirements-background-test.txt

      - name: Run background-service security regression checks
        run: python scripts/test_background_service_security.py

      - name: Run browser regression checks
        run: npm test

      - name: Build deployable Pages site
        run: npm run build:pages

      - name: Check diff hygiene
        run: git diff --check
